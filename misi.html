<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Harian - Moba Mini</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 2px solid gold;
        }
        
        .user-info {
            display: flex;
            align-items: center;
        }
        
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff8a00, #ff2070);
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border: 2px solid gold;
        }
        
        .user-details {
            display: flex;
            flex-direction: column;
        }
        
        .user-details h3 {
            margin-bottom: 5px;
        }
        
        .user-stats {
            display: flex;
        }
        
        .stat {
            display: flex;
            align-items: center;
            margin-right: 20px;
        }
        
        .stat-icon {
            margin-right: 5px;
            font-size: 1.2rem;
        }
        
        .logout-btn {
            background: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        
        .section-title {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: gold;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
        }
        
        .mission-container {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        
        .mission-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.5);
        }
        
        .mission-title {
            font-size: 1.8rem;
            color: gold;
        }
        
        .reset-timer {
            font-size: 1rem;
            color: #ccc;
        }
        
        .mission-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .mission-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s;
        }
        
        .mission-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .mission-item.completed {
            background: rgba(0, 255, 0, 0.1);
        }
        
        .mission-icon {
            font-size: 2rem;
            margin-right: 15px;
            width: 60px;
            text-align: center;
        }
        
        .mission-details {
            flex: 1;
        }
        
        .mission-name {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        
        .mission-description {
            color: #ccc;
            font-size: 0.9rem;
        }
        
        .mission-progress {
            display: flex;
            align-items: center;
            margin-right: 15px;
        }
        
        .mission-reward {
            display: flex;
            align-items: center;
            margin-right: 15px;
            font-weight: bold;
        }
        
        .mission-reward-icon {
            margin-right: 5px;
        }
        
        .mission-action {
            background: linear-gradient(to right, #ff8a00, #ff2070);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mission-action:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 138, 0, 0.4);
        }
        
        .mission-action:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        .mission-action.claimed {
            background: #00b09b;
            cursor: default;
        }
        
        .back-btn {
            margin-top: 30px;
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 176, 155, 0.4);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-left: 5px solid gold;
            border-radius: 8px;
            padding: 15px 20px;
            max-width: 300px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            transform: translateX(120%);
            transition: transform 0.3s;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification-title {
            color: gold;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .notification-message {
            color: white;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .mission-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .mission-progress, .mission-reward, .mission-action {
                margin-top: 10px;
                margin-right: 0;
                align-self: flex-end;
            }
            
            .mission-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="user-info">
            <div class="avatar" id="user-avatar"></div>
            <div class="user-details">
                <h3 id="user-name"></h3>
                <div class="user-stats">
                    <div class="stat">
                        <span class="stat-icon">💰</span>
                        <span id="user-money">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-icon">💎</span>
                        <span id="user-diamond">0</span>
                    </div>
                </div>
            </div>
        </div>

        <button id="logout-btn" class="logout-btn">Keluar</button>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="main-content">
            <h1 class="section-title">Misi Harian</h1>
            
            <div class="mission-container">
                <div class="mission-header">
                    <h2 class="mission-title">Misi Harian</h2>
                    <div class="reset-timer">Reset: <span id="reset-time">24:00:00</span></div>
                </div>
                
                <div class="mission-list">
                    <!-- Misi Login -->
                    <div class="mission-item" id="login-mission">
                        <div class="mission-icon">🔓</div>
                        <div class="mission-details">
                            <div class="mission-name">Login Harian</div>
                            <div class="mission-description">Login ke game 1 kali</div>
                        </div>
                        <div class="mission-progress">
                            <span id="login-progress">0/1</span>
                        </div>
                        <div class="mission-reward">
                            <span class="mission-reward-icon">💰</span>
                            <span>500</span>
                        </div>
                        <button class="mission-action" id="claim-login" disabled>Klaim</button>
                    </div>
                    
                    <!-- Misi Main Game -->
                    <div class="mission-item" id="play-mission">
                        <div class="mission-icon">🎮</div>
                        <div class="mission-details">
                            <div class="mission-name">Main Game</div>
                            <div class="mission-description">Main game apa saja 1 kali</div>
                        </div>
                        <div class="mission-progress">
                            <span id="play-progress">0/1</span>
                        </div>
                        <div class="mission-reward">
                            <span class="mission-reward-icon">💰</span>
                            <span>500</span>
                        </div>
                        <button class="mission-action" id="claim-play" disabled>Klaim</button>
                    </div>
                    
                    <!-- Misi Beli Hero -->
                    <div class="mission-item" id="buy-hero-mission">
                        <div class="mission-icon">🛒</div>
                        <div class="mission-details">
                            <div class="mission-name">Beli Hero</div>
                            <div class="mission-description">Beli hero di shop</div>
                        </div>
                        <div class="mission-progress">
                            <span id="buy-hero-progress">0/1</span>
                        </div>
                        <div class="mission-reward">
                            <span class="mission-reward-icon">💎</span>
                            <span>10</span>
                        </div>
                        <button class="mission-action" id="claim-buy-hero" disabled>Klaim</button>
                    </div>
                </div>
            </div>
            
            <button class="back-btn" id="back-btn">Kembali ke Menu Utama</button>
        </div>
    </div>
    
    <!-- Notification -->
    <div class="notification" id="notification">
        <div class="notification-title" id="notification-title">Berhasil!</div>
        <div class="notification-message" id="notification-message">Reward telah diklaim</div>
    </div>

    <script>
        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAlMyO9iybb7Zc3-JWpaJTOU6mp7dVZw7A",
            authDomain: "taher-online.firebaseapp.com",
            databaseURL: "https://taher-online-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "taher-online",
            storageBucket: "taher-online.firebasestorage.app",
            messagingSenderId: "254196950669",
            appId: "1:254196950669:web:ea7dc25e29e459e791e4c4",
            measurementId: "G-W288VV18S2"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Variabel global
        let currentUser = null;
        let userData = null;
        let dailyMissions = null;

        // Event Listeners
        document.getElementById('logout-btn').addEventListener('click', logout);
        document.getElementById('back-btn').addEventListener('click', goBack);
        document.getElementById('claim-login').addEventListener('click', () => claimReward('login'));
        document.getElementById('claim-play').addEventListener('click', () => claimReward('play'));
        document.getElementById('claim-buy-hero').addEventListener('click', () => claimReward('buy_hero'));

        // Fungsi logout
        function logout() {
            currentUser = null;
            userData = null;
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // Fungsi kembali ke menu utama
        function goBack() {
            window.location.href = 'index.html';
        }

        // Fungsi untuk mendapatkan tanggal hari ini dalam format YYYY-MM-DD
        function getTodayDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Fungsi untuk menghitung waktu hingga reset (24 jam dari waktu login pertama hari ini)
        function calculateResetTime() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);
            
            const diff = tomorrow - now;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // Fungsi untuk memperbarui timer reset
        function updateResetTimer() {
            const resetTimeElement = document.getElementById('reset-time');
            resetTimeElement.textContent = calculateResetTime();
        }

        // Fungsi untuk memuat data misi harian
        function loadDailyMissions() {
            const today = getTodayDate();
            
            database.ref('users/' + currentUser + '/dailyMissions/' + today).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    dailyMissions = snapshot.val();
                } else {
                    // Jika belum ada data misi untuk hari ini, buat data default
                    dailyMissions = {
                        login: { completed: false, claimed: false },
                        play: { completed: false, claimed: false },
                        buy_hero: { completed: false, claimed: false }
                    };
                    
                    // Simpan data misi default ke Firebase
                    database.ref('users/' + currentUser + '/dailyMissions/' + today).set(dailyMissions);
                }
                
                // Update UI misi
                updateMissionsUI();
            }).catch(error => {
                console.error('Error loading daily missions:', error);
            });
        }

        // Fungsi untuk update UI misi
        function updateMissionsUI() {
            if (!dailyMissions) return;
            
            // Update misi login
            const loginMission = document.getElementById('login-mission');
            const loginProgress = document.getElementById('login-progress');
            const claimLoginBtn = document.getElementById('claim-login');
            
            if (dailyMissions.login.completed) {
                loginMission.classList.add('completed');
                loginProgress.textContent = '1/1';
                
                if (dailyMissions.login.claimed) {
                    claimLoginBtn.textContent = 'Telah Diklaim';
                    claimLoginBtn.classList.add('claimed');
                    claimLoginBtn.disabled = true;
                } else {
                    claimLoginBtn.disabled = false;
                }
            } else {
                loginMission.classList.remove('completed');
                loginProgress.textContent = '0/1';
                claimLoginBtn.disabled = true;
            }
            
            // Update misi main game
            const playMission = document.getElementById('play-mission');
            const playProgress = document.getElementById('play-progress');
            const claimPlayBtn = document.getElementById('claim-play');
            
            if (dailyMissions.play.completed) {
                playMission.classList.add('completed');
                playProgress.textContent = '1/1';
                
                if (dailyMissions.play.claimed) {
                    claimPlayBtn.textContent = 'Telah Diklaim';
                    claimPlayBtn.classList.add('claimed');
                    claimPlayBtn.disabled = true;
                } else {
                    claimPlayBtn.disabled = false;
                }
            } else {
                playMission.classList.remove('completed');
                playProgress.textContent = '0/1';
                claimPlayBtn.disabled = true;
            }
            
            // Update misi beli hero
            const buyHeroMission = document.getElementById('buy-hero-mission');
            const buyHeroProgress = document.getElementById('buy-hero-progress');
            const claimBuyHeroBtn = document.getElementById('claim-buy-hero');
            
            if (dailyMissions.buy_hero.completed) {
                buyHeroMission.classList.add('completed');
                buyHeroProgress.textContent = '1/1';
                
                if (dailyMissions.buy_hero.claimed) {
                    claimBuyHeroBtn.textContent = 'Telah Diklaim';
                    claimBuyHeroBtn.classList.add('claimed');
                    claimBuyHeroBtn.disabled = true;
                } else {
                    claimBuyHeroBtn.disabled = false;
                }
            } else {
                buyHeroMission.classList.remove('completed');
                buyHeroProgress.textContent = '0/1';
                claimBuyHeroBtn.disabled = true;
            }
        }

        // Fungsi untuk mengklaim reward
        function claimReward(missionType) {
            if (!dailyMissions || dailyMissions[missionType].claimed) return;
            
            // Tandai misi sebagai telah diklaim
            dailyMissions[missionType].claimed = true;
            
            // Berikan reward sesuai jenis misi
            let rewardAmount = 0;
            let rewardType = '';
            
            switch(missionType) {
                case 'login':
                    rewardAmount = 500;
                    rewardType = 'money';
                    break;
                case 'play':
                    rewardAmount = 500;
                    rewardType = 'money';
                    break;
                case 'buy_hero':
                    rewardAmount = 10;
                    rewardType = 'diamond';
                    break;
            }
            
            // Update data user dengan reward
            if (rewardType === 'money') {
                userData.money += rewardAmount;
            } else if (rewardType === 'diamond') {
                userData.diamond += rewardAmount;
            }
            
            // Simpan data misi dan user ke Firebase
            const today = getTodayDate();
            const updates = {};
            updates['users/' + currentUser + '/dailyMissions/' + today] = dailyMissions;
            updates['users/' + currentUser + '/money'] = userData.money;
            updates['users/' + currentUser + '/diamond'] = userData.diamond;
            
            database.ref().update(updates).then(() => {
                // Update UI
                updateMissionsUI();
                updateUserUI();
                
                // Tampilkan notifikasi
                showNotification('Reward Berhasil Diklaim', `Anda mendapatkan ${rewardAmount} ${rewardType === 'money' ? 'Koin' : 'Diamond'}!`);
            }).catch(error => {
                console.error('Error claiming reward:', error);
                showNotification('Error', 'Gagal mengklaim reward. Silakan coba lagi.');
            });
        }

        // Fungsi untuk update UI user
        function updateUserUI() {
            if (!userData) return;
            
            document.getElementById('user-name').textContent = userData.username;
            document.getElementById('user-avatar').textContent = userData.username.charAt(0).toUpperCase();
            document.getElementById('user-money').textContent = userData.money;
            document.getElementById('user-diamond').textContent = userData.diamond;
        }

        // Fungsi untuk menampilkan notifikasi
        function showNotification(title, message) {
            const notification = document.getElementById('notification');
            const notificationTitle = document.getElementById('notification-title');
            const notificationMessage = document.getElementById('notification-message');
            
            notificationTitle.textContent = title;
            notificationMessage.textContent = message;
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Cek apakah user sudah login saat memuat halaman
        window.addEventListener('DOMContentLoaded', function() {
            const savedUser = localStorage.getItem('currentUser');
            
            if (savedUser) {
                // Ambil data user dari database
                database.ref('users/' + savedUser).once('value').then(snapshot => {
                    if (snapshot.exists()) {
                        userData = snapshot.val();
                        currentUser = savedUser;
                        
                        // Update UI user
                        updateUserUI();
                        
                        // Muat data misi harian
                        loadDailyMissions();
                        
                        // Update timer reset setiap detik
                        setInterval(updateResetTimer, 1000);
                        updateResetTimer();
                    } else {
                        localStorage.removeItem('currentUser');
                        window.location.href = 'index.html';
                    }
                });
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
