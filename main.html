    <style>
        /* CSS tetap sama, tidak ada perubahan */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #000;
            color: white;
            overflow: hidden;
            touch-action: none;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a5c1a;
        }
        
        /* UI Gameplay */
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        /* Minimap */
        #minimap {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid gold;
            border-radius: 5px;
            z-index: 11;
        }
        
        /* HP Bar */
        .hp-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
            z-index: 11;
        }
        
        .hp-fill {
            height: 100%;
            background: linear-gradient(to right, #ff0000, #ff9900);
            border-radius: 8px;
            transition: width 0.3s;
        }
        
        /* Joystick */
        #joystick-container {
            position: absolute;
            bottom: 120px;
            left: 50px;
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            pointer-events: auto;
            z-index: 12;
        }
        
        #joystick {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
        }
        
        /* Skill Buttons */
        #skill-container {
            position: absolute;
            bottom: 100px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: auto;
            z-index: 12;
        }
        
        .skill-row {
            display: flex;
            gap: 10px;
        }
        
        .skill-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .skill-btn:active {
            transform: scale(0.95);
            background: rgba(50, 50, 50, 0.7);
        }
        
        .skill-cooldown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        #basic-attack {
            background: rgba(200, 0, 0, 0.7);
        }
        
        /* Target Indicator */
        .target-indicator {
            position: absolute;
            width: 10px;
            height: 10px;
            background: red;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9;
            display: none;
        }
        
        /* Shop Button */
        #shop-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid gold;
            border-radius: 10px;
            color: gold;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            z-index: 12;
        }
        
        /* Shop Modal */
        #shop-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        
        .shop-content {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid gold;
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .shop-title {

            font-size: 1.5rem;

        }
        
        .shop-item {

        .shop-item-info {

        }
        
        .shop-item-name {
            font-weight: bold;

        .shop-item-desc {

        .shop-item-price {
            display: flex;
            align-items: center;

        }
        
        .buy-btn {

            color: white;
            padding: 8px 15px;

            cursor: pointer;

        /* Game Over Modal */
        #game-over-modal {

        .game-over-title {

        .stat-item {
            display: flex;

            margin-bottom: 10px;
        }
        
        .back-to-menu {
            background: linear-gradient(to right, #ff8a00, #ff2070);

        /* Loading Screen */
        #loading-screen {

        .loading-title {

        .loading-progress {
            height: 100%;
            background: linear-gradient(to right, #ff8a00, #ff2070);
            width: 0%;
            transition: width 0.3s;
        }

                }
            },
            "saskeh": {
                name: "Saskeh",
                maxHp: 5500,
                skills: {
                    skill1: { name: "Speed Boost", damage: 0, cooldown: 5, effect: "buff", effectDuration: 3.5, buff: { speed: 2.0 } },
                    skill2: { name: "Chidori", damage: 170, cooldown: 7, effect: "damage" },
                    skill3: { name: "Mangekyo", damage: 70, cooldown: 19, effect: "transform", effectDuration: 5, buff: { damage: 70, attackSpeed: 20, speed: 0.5 } }
                }

                maxHp: 5000,
                skills: {

                    skill2: { name: "Coming Soon", damage: 0, cooldown: 5 },
                    skill3: { name: "Coming Soon", damage: 0, cooldown: 16 }
                }

        // Data item
        const itemData = {
            "sepatu": { name: "Sepatu", price: 400, effect: "cooldown", value: 0.3 },
            "pistol": { name: "Pistol", price: 850, effect: "damage", value: 70 },
            "blade_es": { name: "Blade Es", price: 900, effect: "slow", value: { slow: 0.1, attackSlow: 0.2, damage: 60 } }
        };
        
        // Data map
        const mapData = {
            width: 2000,
            height: 2000,
            baseBlue: { x: 200, y: 1000, radius: 100 },
            baseRed: { x: 1800, y: 1000, radius: 100 },
            turrets: [
                { x: 500, y: 1000, team: 'blue', hp: 2000, damage: 900, range: 150, attackCooldown: 0, lastAttackTime: 0 },
                { x: 1500, y: 1000, team: 'red', hp: 2000, damage: 900, range: 150, attackCooldown: 0, lastAttackTime: 0 }
            ],
            buffs: [
                { x: 600, y: 600, team: 'blue', hp: 4000, gold: 150 },
                { x: 600, y: 1400, team: 'blue', hp: 4000, gold: 150 },
                { x: 1400, y: 600, team: 'red', hp: 4000, gold: 150 },
                { x: 1400, y: 1400, team: 'red', hp: 4000, gold: 150 }
            ]
        };
        
        // Joystick
        let joystick = {
            x: 0,
            y: 0,
            active: false,
            baseX: 0,
            baseY: 0,
            touchId: null
        };
        
        // Kamera
        let camera = {
            x: 0,
            y: 0
        };

        // Target lock system
        let targetLock = {
            enabled: false,
            target: null,
            type: null // 'player', 'minion', 'turret'
        };
        
        // Inisialisasi game
        function init() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            
            // Set canvas size
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Ambil data user
            currentUser = localStorage.getItem('currentUser');
            if (!currentUser) {
                window.location.href = 'index.html';
                return;
            }
            
            // Ambil data dari Firebase
            database.ref('users/' + currentUser).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    userData = snapshot.val();
                    selectedHero = userData.selectedHero;
                    gameMode = userData.gameMode;
                    
                    // Setup player berdasarkan hero yang dipilih
                    setupPlayer();
                    
                    // Setup game
                    setupGame();
                    
                    // Setup event listeners
                    setupEventListeners();
                    
                    // Mulai game loop
                    requestAnimationFrame(gameLoop);
                    
                    // Sembunyikan loading screen
                    setTimeout(() => {
                        document.getElementById('loading-screen').style.display = 'none';
                    }, 1000);
                } else {
                    window.location.href = 'index.html';
                }
            });
        }
        
        // Setup player
        function setupPlayer() {
            const hero = heroData[selectedHero];
            if (!hero) return;
            
            player.maxHp = hero.maxHp;
            player.hp = hero.maxHp;
            player.skills = JSON.parse(JSON.stringify(hero.skills)); // Deep copy
            player.x = mapData.baseBlue.x;
            player.y = mapData.baseBlue.y;
            
            // Update HP bar
            updateHpBar();
        }
        
        // Setup game
        function setupGame() {
            // Setup turrets
            gameState.turrets = mapData.turrets.map(turret => ({ ...turret }));
            
            // Setup buffs
            gameState.buffs = mapData.buffs.map(buff => ({ ...buff }));
            
            // Setup AI players
            setupAIPlayers();
            
            // Setup minions
            spawnMinions();
        }
        
        // Setup AI players - DIPERBAIKI: AI tidak langsung push di awal
        function setupAIPlayers() {
            // AI untuk tim biru (2 AI)
            const blueAI = [
                { id: 'ai_blue_1', hero: 'narto', x: 300, y: 900, team: 'blue', type: 'buff', state: 'seek_buff', gold: 0, items: [], target: null, attackCooldown: 0 },
                { id: 'ai_blue_2', hero: 'saskeh', x: 300, y: 1100, team: 'blue', type: 'defender', state: 'patrol', gold: 0, items: [], target: null, attackCooldown: 0 }
            ];
            
            // AI untuk tim merah (3 AI) - DIPERBAIKI: State awal tidak langsung push
            const redAI = [
                { id: 'ai_red_1', hero: 'narto', x: 1700, y: 900, team: 'red', type: 'buff', state: 'seek_buff', gold: 0, items: [], target: null, attackCooldown: 0 },
                { id: 'ai_red_2', hero: 'saskeh', x: 1700, y: 1100, team: 'red', type: 'minion', state: 'seek_gold', gold: 0, items: [], target: null, attackCooldown: 0 },
                { id: 'ai_red_3', hero: 'lord_tachi', x: 1700, y: 1000, team: 'red', type: 'objective', state: 'seek_buff', gold: 0, items: [], target: null, attackCooldown: 0 }
            ];
            
            // Gabungkan semua AI
            gameState.players = [...blueAI, ...redAI].map(ai => {
                const hero = heroData[ai.hero];
                return {
                    ...ai,
                    radius: 25,
                    speed: 3,
                    maxHp: hero.maxHp,
                    hp: hero.maxHp,
                    damage: 50,
                    skills: JSON.parse(JSON.stringify(hero.skills)), // Deep copy
                    lastAttackTime: 0,
                    alive: true // DITAMBAH: Status hidup AI
                };
            });
        }
        
        // Setup event listeners
        function setupEventListeners() {
            // Joystick events
            const joystickContainer = document.getElementById('joystick-container');
            
            joystickContainer.addEventListener('touchstart', handleJoystickStart, { passive: false });
            joystickContainer.addEventListener('touchmove', handleJoystickMove, { passive: false });
            joystickContainer.addEventListener('touchend', handleJoystickEnd);
            
            // Skill buttons
            document.getElementById('skill-1').addEventListener('touchstart', () => useSkill(1));
            document.getElementById('skill-2').addEventListener('touchstart', () => useSkill(2));
            document.getElementById('skill-3').addEventListener('touchstart', () => useSkill(3));
            document.getElementById('basic-attack').addEventListener('touchstart', basicAttack);
            
            // Shop button
            document.getElementById('shop-btn').addEventListener('click', openShop);
            document.getElementById('close-shop').addEventListener('click', closeShop);
            
            // Back to menu button
            document.getElementById('back-to-menu').addEventListener('click', backToMenu);
            
            // Window resize
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }
        
        // Joystick handlers
        function handleJoystickStart(e) {
            e.preventDefault();
            if (joystick.active) return;
            
            const touch = e.touches[0];
            const rect = e.target.getBoundingClientRect();
            
            joystick.active = true;
            joystick.touchId = touch.identifier;
            joystick.baseX = rect.left + rect.width / 2;
            joystick.baseY = rect.top + rect.height / 2;
            
            updateJoystickPosition(touch.clientX, touch.clientY);
        }
        
        function handleJoystickMove(e) {
            e.preventDefault();
            if (!joystick.active) return;
            
            // Cari touch yang sesuai
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].identifier === joystick.touchId) {
                    updateJoystickPosition(e.touches[i].clientX, e.touches[i].clientY);
                    break;
                }
            }
        }
        
        function handleJoystickEnd(e) {
            if (!joystick.active) return;
            
            // Cari touch yang sesuai
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystick.touchId) {
                    joystick.active = false;
                    joystick.x = 0;
                    joystick.y = 0;
                    updateJoystickVisual();
                    break;
                }
            }
        }
        
        function updateJoystickPosition(clientX, clientY) {
            const dx = clientX - joystick.baseX;
            const dy = clientY - joystick.baseY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const maxDistance = 50; // Max joystick movement
            
            if (distance > maxDistance) {
                joystick.x = (dx / distance) * maxDistance;
                joystick.y = (dy / distance) * maxDistance;
            } else {
                joystick.x = dx;
                joystick.y = dy;
            }
            
            updateJoystickVisual();
        }
        
        function updateJoystickVisual() {
            const joystickElement = document.getElementById('joystick');
            joystickElement.style.transform = `translate(calc(-50% + ${joystick.x}px), calc(-50% + ${joystick.y}px))`;
        }
        
        // Skill functions
        function useSkill(skillNum) {
            const skillKey = `skill${skillNum}`;
            const skill = player.skills[skillKey];
            
            if (skill.cooldown > 0) return;
            
            // Set cooldown
            skill.cooldown = skill.maxCooldown;
            
            // Update UI
            updateSkillCooldown(skillNum, skill.maxCooldown);
            
            // Implementasi efek skill berdasarkan hero
            if (selectedHero === 'narto') {
                useNartoSkill(skillNum);
            } else if (selectedHero === 'saskeh') {
                useSaskehSkill(skillNum);
            }
            // Lord Tachi skills coming soon
        }
        
        function useNartoSkill(skillNum) {
            if (skillNum === 1) {
                // Rasengan Mini - lempar projectile yang stun musuh
                createProjectile(player.x, player.y, 10, 5, 300, player.damage + 20, 'stun');
            } else if (skillNum === 2) {
                // Kyuubi Boost - buff attack speed dan damage
                player.damage += 30;
                setTimeout(() => {
                    player.damage -= 30;
                }, 2500);
            } else if (skillNum === 3) {
                // Mode Kurama - transformasi dengan buff besar
                player.damage += 40;
                setTimeout(() => {
                    player.damage -= 40;
                }, 5000);
            }
        }
        
        function useSaskehSkill(skillNum) {
            if (skillNum === 1) {
                // Speed Boost - meningkatkan speed
                player.speed += 2;
                setTimeout(() => {
                    player.speed -= 2;
                }, 3500);
            } else if (skillNum === 2) {
                // Chidori - damage besar ke musuh terdekat
                const nearestEnemy = findNearestEnemy();
                if (nearestEnemy && getDistance(player, nearestEnemy) < 200) {
                    nearestEnemy.hp -= player.damage + 170;
                    if (nearestEnemy.hp <= 0) {
                        player.kills++;
                        handleEnemyDeath(nearestEnemy);
                    }
                }
            } else if (skillNum === 3) {
                // Mangekyo - transformasi dengan buff
                player.damage += 70;
                player.speed += 0.5;
                setTimeout(() => {
                    player.damage -= 70;
                    player.speed -= 0.5;
                }, 5000);
            }
        }
        
        // Basic attack - DIPERBAIKI: Bisa menyerang turet dan mencari target yang terlihat di layar
        function basicAttack() {
            // Cek cooldown attack (3.5 detik)
            const now = Date.now();
            if (now - player.lastAttackTime < 3500) return;
            
            // Cari target terdekat dalam jarak 150 yang terlihat di layar
            const nearestEnemy = findNearestVisibleEnemy();
            if (nearestEnemy && getDistance(player, nearestEnemy) < 150) {
                nearestEnemy.hp -= player.damage;
                player.lastAttackTime = now;
                
                // DIPERBAIKI: Cek jika target adalah turet
                if (nearestEnemy.hp <= 0) {
                    if (nearestEnemy.range) { // Jika ada property range, berarti ini turet
                        player.gold += 300; // Beri gold untuk menghancurkan turet
                    } else {
                        player.kills++;
                        handleEnemyDeath(nearestEnemy);
                    }
                }
            }
        }
        
        // DITAMBAH: Fungsi untuk mencari musuh terdekat yang terlihat di layar
        function findNearestVisibleEnemy() {
            let nearest = null;
            let minDistance = 150; // Jarak maksimum serangan
            
            // Cari di antara AI players yang terlihat di layar
            gameState.players.forEach(p => {
                if (p.team !== player.team && p.hp > 0 && p.alive) {
                    const distance = getDistance(player, p);
                    if (distance < minDistance && isInViewport(p.x, p.y)) {
                        minDistance = distance;
                        nearest = p;
                    }
                }
            });
            
            // Cari turet musuh yang terlihat di layar
            gameState.turrets.forEach(turret => {
                if (turret.team !== player.team && turret.hp > 0) {
                    const distance = getDistance(player, turret);
                    if (distance < minDistance && isInViewport(turret.x, turret.y)) {
                        minDistance = distance;
                        nearest = turret;
                    }
                }
            });
            
            // Cari minion musuh yang terlihat di layar
            gameState.minions.forEach(minion => {
                if (minion.team !== player.team && minion.hp > 0) {
                    const distance = getDistance(player, minion);
                    if (distance < minDistance && isInViewport(minion.x, minion.y)) {
                        minDistance = distance;
                        nearest = minion;
                    }
                }
            });
            
            return nearest;
        }
        
        // DITAMBAH: Fungsi untuk mengecek apakah objek terlihat di viewport
        function isInViewport(x, y) {
            return x >= camera.x && x <= camera.x + canvas.width &&
                   y >= camera.y && y <= camera.y + canvas.height;
        }
        
        // DIPERBAIKI: Fungsi handleEnemyDeath
        function handleEnemyDeath(enemy) {
            // Beri gold untuk kill
            player.gold += 200;
            
            // Tandai enemy sebagai tidak alive
            enemy.alive = false;
            enemy.hp = 0;
            
            // Respawn enemy setelah 10 detik
            setTimeout(() => {
                enemy.hp = enemy.maxHp;
                enemy.alive = true;
                if (enemy.team === 'blue') {
                    enemy.x = mapData.baseBlue.x;
                    enemy.y = mapData.baseBlue.y;
                } else {
                    enemy.x = mapData.baseRed.x;
                    enemy.y = mapData.baseRed.y;
                }
            }, 10000);
        }
        
        function findNearestEnemy() {
            let nearest = null;
            let minDistance = Infinity;
            
            // Cari di antara AI players
            gameState.players.forEach(p => {
                if (p.team !== player.team && p.hp > 0 && p.alive) {
                    const distance = getDistance(player, p);
                    if (distance < minDistance) {
                        minDistance = distance;
                        nearest = p;
                    }
                }
            });
            
            return nearest;
        }
        
        function createProjectile(x, y, radius, speed, range, damage, effect) {
            const dx = joystick.x || 1;
            const dy = joystick.y || 0;
            const angle = Math.atan2(dy, dx);
            
            gameState.projectiles.push({
                x: x,
                y: y,
                radius: radius,
                speed: speed,
                range: range,
                damage: damage,
                effect: effect,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                distance: 0
            });
        }
        
        // Shop functions
        function openShop() {
            document.getElementById('shop-modal').style.display = 'flex';
            
            // Populate shop items
            const shopItems = document.getElementById('shop-items');
            shopItems.innerHTML = '';
            
            Object.keys(itemData).forEach(itemId => {
                const item = itemData[itemId];
                const itemElement = document.createElement('div');
                itemElement.className = 'shop-item';
                
                itemElement.innerHTML = `
                    <div class="shop-item-info">
                        <div class="shop-item-name">${item.name}</div>
                        <div class="shop-item-desc">${getItemDescription(item)}</div>
                    </div>
                    <div class="shop-item-price">
                        <span>💰 ${item.price}</span>
                    </div>
                    <div class="buy-btn" data-item="${itemId}">BELI</div>
                `;
                
                shopItems.appendChild(itemElement);
            });
            
            // Add event listeners to buy buttons
            document.querySelectorAll('.buy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const itemId = this.getAttribute('data-item');
                    buyItem(itemId);
                });
            });
        }
        
        function closeShop() {
            document.getElementById('shop-modal').style.display = 'none';
        }
        
        function getItemDescription(item) {
            if (item.effect === 'cooldown') {
                return `Mengurangi cooldown skill sebesar ${item.value * 100}%`;
            } else if (item.effect === 'damage') {
                return `Menambah damage sebesar ${item.value}`;
            } else if (item.effect === 'slow') {
                return `Setiap 3 basic attack mengurangi speed lawan ${item.value.slow * 100}% dan attack speed ${item.value.attackSlow * 100}%, +${item.value.damage} damage`;
            }
            return '';
        }
        
        function buyItem(itemId) {
            const item = itemData[itemId];
            
            if (player.gold < item.price) {
                alert('Gold tidak cukup!');
                return;
            }
            
            player.gold -= item.price;
            player.items.push(itemId);
            
            // Terapkan efek item
            applyItemEffect(item);
            
            alert(`Anda berhasil membeli ${item.name}!`);
            closeShop();
        }
        
        function applyItemEffect(item) {
            if (item.effect === 'cooldown') {
                // Kurangi cooldown semua skill
                Object.keys(player.skills).forEach(skillKey => {
                    player.skills[skillKey].maxCooldown *= (1 - item.value);
                });
            } else if (item.effect === 'damage') {
                player.damage += item.value;
            }
            // Efek blade_es akan diterapkan saat basic attack
        }
        
        // Game loop
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function update() {
            // Update game time
            gameState.gameTime += 1/60;
            
            // Update gold setiap 10 detik
            gameState.goldTimer += 1/60;
            if (gameState.goldTimer >= 10) {
                player.gold += 50;
                player.level += 400;
                gameState.goldTimer = 0;
            }
            
            // Update minion spawn
            gameState.minionTimer += 1/60;
            if (gameState.minionTimer >= 20) {
                spawnMinions();
                gameState.minionTimer = 0;
            }
            
            // Update player movement
            if (joystick.active) {
                player.x += (joystick.x / 50) * player.speed;
                player.y += (joystick.y / 50) * player.speed;
                
                // Batasi player dalam map
                player.x = Math.max(player.radius, Math.min(mapData.width - player.radius, player.x));
                player.y = Math.max(player.radius, Math.min(mapData.height - player.radius, player.y));
            }
            
            // Update camera untuk follow player
            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;
            
            // Batasi camera dalam map
            camera.x = Math.max(0, Math.min(mapData.width - canvas.width, camera.x));
            camera.y = Math.max(0, Math.min(mapData.height - canvas.height, camera.y));
            
            // Update skill cooldowns
            Object.keys(player.skills).forEach((skillKey, index) => {
                if (player.skills[skillKey].cooldown > 0) {
                    player.skills[skillKey].cooldown -= 1/60;
                    if (player.skills[skillKey].cooldown <= 0) {
                        updateSkillCooldown(index + 1, 0);
                    }
                }
            });
            
            // Update AI
            updateAI();
            
            // Update projectiles
            updateProjectiles();
            
            // Update minions
            updateMinions();
            
            // Update turrets
            updateTurrets();
            
            // Check base effects
            checkBaseEffects();
            
            // Check game over condition
            checkGameOver();
        }
        
        function updateAI() {
            gameState.players.forEach(ai => {
                // Skip AI yang mati
                if (!ai.alive) return;
                
                // Update AI state machine
                updateAIState(ai);
                
                // Batasi AI dalam map
                ai.x = Math.max(ai.radius, Math.min(mapData.width - ai.radius, ai.x));
                ai.y = Math.max(ai.radius, Math.min(mapData.height - ai.radius, ai.y));
                
                // Update skill cooldowns untuk AI
                Object.keys(ai.skills).forEach(skillKey => {
                    if (ai.skills[skillKey].cooldown > 0) {
                        ai.skills[skillKey].cooldown -= 1/60;
                    }
                });
            });
        }
        
        function updateAIState(ai) {
            switch(ai.type) {
                case 'buff':
                    updateBuffAI(ai);
                    break;
                case 'minion':
                    updateMinionAI(ai);
                    break;
                case 'objective':
                    updateObjectiveAI(ai);
                    break;
                case 'defender':
                    updateDefenderAI(ai);
                    break;
            }
        }
        
        function updateBuffAI(ai) {
            // State machine untuk AI buff
            switch(ai.state) {
                case 'seek_buff':
                    // Cari buff tim sendiri
                    const teamBuff = gameState.buffs.find(buff => buff.team === ai.team && buff.hp > 0);
                    if (teamBuff) {
                        moveTowards(ai, teamBuff.x, teamBuff.y);
                        if (getDistance(ai, teamBuff) < 100) {
                            ai.state = 'attack_buff';
                        }
                    } else {
                        ai.state = 'seek_gold';
                    }
                    break;
                    
                case 'attack_buff':
                    const currentBuff = gameState.buffs.find(buff => buff.team === ai.team && buff.hp > 0);
                    if (currentBuff) {
                        // Attack buff setiap 3.5 detik
                        const now = Date.now();
                        if (now - ai.lastAttackTime >= 3500) {
                            currentBuff.hp -= ai.damage;
                            ai.lastAttackTime = now;
                            
                            if (currentBuff.hp <= 0) {
                                ai.gold += currentBuff.gold;
                                ai.state = 'seek_gold';
                            }
                        }
                    } else {
                        ai.state = 'seek_gold';
                    }
                    break;
                    
                case 'seek_gold':
                    // Cari gold dengan membunuh minion
                    const enemyMinion = gameState.minions.find(minion => minion.team !== ai.team);
                    if (enemyMinion) {
                        moveTowards(ai, enemyMinion.x, enemyMinion.y);
                        if (getDistance(ai, enemyMinion) < 100) {
                            ai.state = 'attack_minion';
                        }
                    } else {
                        // DIPERBAIKI: Tidak langsung push, cari musuh dulu
                        ai.state = 'seek_enemy';
                    }
                    break;
                    
                case 'attack_minion':
                    const targetMinion = gameState.minions.find(minion => minion.team !== ai.team && getDistance(ai, minion) < 100);
                    if (targetMinion) {
                        const now = Date.now();
                        if (now - ai.lastAttackTime >= 3500) {
                            targetMinion.hp -= ai.damage;
                            ai.lastAttackTime = now;
                            
                            if (targetMinion.hp <= 0) {
                                ai.gold += 50;
                                // Cek jika punya cukup gold untuk item
                                if (ai.gold >= 400 && !ai.items.includes('sepatu')) {
                                    ai.items.push('sepatu');
                                    applyItemEffectToAI(ai, itemData['sepatu']);
                                }
                                // DIPERBAIKI: Tidak langsung push, cari musuh dulu
                                ai.state = 'seek_enemy';
                            }
                        }
                    } else {
                        ai.state = 'seek_enemy';
                    }
                    break;
                    
                case 'seek_enemy':
                    // Cari musuh untuk dibunuh
                    const enemy = findAIEnemy(ai);
                    if (enemy) {
                        moveTowards(ai, enemy.x, enemy.y);
                        if (getDistance(ai, enemy) < 150) {
                            ai.state = 'attack_enemy';
                        }
                    } else {
                        // DIPERBAIKI: Hanya push jika sudah cukup kuat atau kondisi tertentu
                        if (ai.gold >= 800 || gameState.gameTime > 120) { // Setelah 2 menit atau punya cukup gold
                            ai.state = 'push_turret';
                        }
                    }
                    break;
                    
                case 'attack_enemy':
                    const currentEnemy = findAIEnemy(ai);
                    if (currentEnemy && getDistance(ai, currentEnemy) < 150) {
                        const now = Date.now();
                        if (now - ai.lastAttackTime >= 3500) {
                            currentEnemy.hp -= ai.damage;
                            ai.lastAttackTime = now;
                            
                            if (currentEnemy.hp <= 0) {
                                ai.kills++;
                                ai.gold += 200;
                                handleEnemyDeath(currentEnemy);
                                // DIPERBAIKI: Tidak langsung push setelah kill
                                ai.state = 'seek_enemy';
                            }
                        }
                    } else {
                        ai.state = 'seek_enemy';
                    }
                    break;
                    
                case 'push_turret':
                    // Push turet musuh
                    const enemyTurret = gameState.turrets.find(turret => turret.team !== ai.team && turret.hp > 0);
                    if (enemyTurret) {
                        moveTowards(ai, enemyTurret.x, enemyTurret.y);
                        if (getDistance(ai, enemyTurret) < 150) {
                            ai.state = 'attack_turret';
                        }
                    }
                    break;
                    
                case 'attack_turret':
                    const currentTurret = gameState.turrets.find(turret => turret.team !== ai.team && turret.hp > 0);
                    if (currentTurret && getDistance(ai, currentTurret) < 150) {
                        const now = Date.now();
                        if (now - ai.lastAttackTime >= 3500) {
                            currentTurret.hp -= ai.damage;
                            ai.lastAttackTime = now;
                        }
                    } else {
                        ai.state = 'push_turret';
                    }
                    break;
            }
        }
        
        function updateMinionAI(ai) {
            // AI yang fokus ke minion
            const enemyMinion = gameState.minions.find(minion => minion.team !== ai.team);
            if (enemyMinion) {
                moveTowards(ai, enemyMinion.x, enemyMinion.y);
                
                // Jika dekat, serang minion
                if (getDistance(ai, enemyMinion) < 100) {
                    const now = Date.now();
                    if (now - ai.lastAttackTime >= 3500) {
                        enemyMinion.hp -= ai.damage;
                        ai.lastAttackTime = now;
                    }
                }
            } else {
                // Jika tidak ada minion, cari musuh
                updateObjectiveAI(ai);
            }
        }
        
        function updateObjectiveAI(ai) {
            // AI yang fokus ke objektif (turet, base)
            const enemyTurret = gameState.turrets.find(turret => turret.team !== ai.team && turret.hp > 0);
            if (enemyTurret) {
                moveTowards(ai, enemyTurret.x, enemyTurret.y);
                
                // Jika dekat, serang turet
                if (getDistance(ai, enemyTurret) < 150) {
                    const now = Date.now();
                    if (now - ai.lastAttackTime >= 3500) {
                        enemyTurret.hp -= ai.damage;
                        ai.lastAttackTime = now;
                    }
                }
            } else {
                // Jika tidak ada turet, cari base musuh
                const enemyBase = ai.team === 'blue' ? mapData.baseRed : mapData.baseBlue;
                moveTowards(ai, enemyBase.x, enemyBase.y);
            }
        }
        
        function updateDefenderAI(ai) {
            // AI defender yang melindungi turet
            const teamTurret = gameState.turrets.find(turret => turret.team === ai.team);
            
            // Cek jika ada musuh dekat turet
            let threat = null;
            let minDistance = Infinity;
            
            // Cari player musuh
            if (player.team !== ai.team && getDistance(player, teamTurret) < 200) {
                const distance = getDistance(player, teamTurret);
                if (distance < minDistance) {
                    minDistance = distance;
                    threat = player;
                }
            }
            
            // Cari AI musuh
            gameState.players.forEach(p => {
                if (p.team !== ai.team && p.hp > 0 && p.alive && getDistance(p, teamTurret) < 200) {
                    const distance = getDistance(p, teamTurret);
                    if (distance < minDistance) {
                        minDistance = distance;
                        threat = p;
                    }
                }
            });
            
            // Cari minion musuh
            gameState.minions.forEach(minion => {
                if (minion.team !== ai.team && getDistance(minion, teamTurret) < 200) {
                    const distance = getDistance(minion, teamTurret);
                    if (distance < minDistance) {
                        minDistance = distance;
                        threat = minion;
                    }
                }
            });
            
            if (threat) {
                // Ada ancaman, serang!
                moveTowards(ai, threat.x, threat.y);
                
                if (getDistance(ai, threat) < 150) {
                    const now = Date.now();
                    if (now - ai.lastAttackTime >= 3500) {
                        threat.hp -= ai.damage;
                        ai.lastAttackTime = now;
                        
                        if (threat.hp <= 0) {
                            if (threat !== player) {
                                ai.kills++;
                                handleEnemyDeath(threat);
                            }
                        }
                    }
                }
            } else {
                // Tidak ada ancaman, patroli di sekitar turet
                const patrolX = teamTurret.x + Math.sin(gameState.gameTime) * 100;
                const patrolY = teamTurret.y + Math.cos(gameState.gameTime) * 100;
                moveTowards(ai, patrolX, patrolY);
            }
        }
        
        function findAIEnemy(ai) {
            let nearest = null;
            let minDistance = Infinity;
            
            // Cari player musuh
            if (player.team !== ai.team && player.hp > 0) {
                const distance = getDistance(ai, player);
                if (distance < minDistance) {
                    minDistance = distance;
                    nearest = player;
                }
            }
            
            // Cari AI musuh
            gameState.players.forEach(p => {
                if (p.team !== ai.team && p.hp > 0 && p.alive && p !== ai) {
                    const distance = getDistance(ai, p);
                    if (distance < minDistance) {
                        minDistance = distance;
                        nearest = p;
                    }
                }
            });
            
            return nearest;
        }
        
        function applyItemEffectToAI(ai, item) {
            if (item.effect === 'cooldown') {
                Object.keys(ai.skills).forEach(skillKey => {
                    ai.skills[skillKey].maxCooldown *= (1 - item.value);
                });
            } else if (item.effect === 'damage') {
                ai.damage += item.value;
            }
        }
        
        function moveTowards(obj, targetX, targetY) {
            const dx = targetX - obj.x;
            const dy = targetY - obj.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance > 0) {
                obj.x += (dx / distance) * obj.speed;
                obj.y += (dy / distance) * obj.speed;
            }
        }
        
        function updateProjectiles() {
            for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
                const projectile = gameState.projectiles[i];
                
                // Update position
                projectile.x += projectile.vx;
                projectile.y += projectile.vy;
                projectile.distance += projectile.speed;
                
                // Check jika sudah mencapai max range
                if (projectile.distance >= projectile.range) {
                    gameState.projectiles.splice(i, 1);
                    continue;
                }
                
                // Check collision dengan musuh
                let hit = false;
                gameState.players.forEach(enemy => {
                    if (enemy.team !== player.team && enemy.alive && getDistance(projectile, enemy) < projectile.radius + enemy.radius) {
                        enemy.hp -= projectile.damage;
                        
                        // Apply effect
                        if (projectile.effect === 'stun') {
                            // Stun enemy selama 3 detik
                            enemy.speed = 0;
                            setTimeout(() => {
                                enemy.speed = 3;
                            }, 3000);
                        }
                        
                        hit = true;
                    }
                });
                
                // Hapus projectile jika kena musuh
                if (hit) {
                    gameState.projectiles.splice(i, 1);
                }
            }
        }
        
        function updateTurrets() {
            gameState.turrets.forEach(turret => {
                // Cari target untuk turet (prioritas: minion > hero)
                let target = null;
                
                // Cari minion musuh dalam range
                const minionTarget = gameState.minions.find(minion => 
                    minion.team !== turret.team && 
                    getDistance(minion, turret) < turret.range
                );
                
                if (minionTarget) {
                    target = minionTarget;
                } else {
                    // Cari hero musuh dalam range
                    if (player.team !== turret.team && getDistance(player, turret) < turret.range) {
                        target = player;
                    } else {
                        const heroTarget = gameState.players.find(p => 
                            p.team !== turret.team && 
                            p.hp > 0 && 
                            p.alive &&
                            getDistance(p, turret) < turret.range
                        );
                        if (heroTarget) {
                            target = heroTarget;
                        }
                    }
                }
                
                // Jika ada target, serang dengan cooldown 3.5 detik
                if (target) {
                    const now = Date.now();
                    if (now - turret.lastAttackTime >= 3500) {
                        target.hp -= turret.damage;
                        turret.lastAttackTime = now;
                        
                        if (target.hp <= 0) {
                            if (target === player) {
                                player.deaths++;
                                respawnPlayer();
                            }
                        }
                    }
                }
            });
        }
        
        function spawnMinions() {
            // Spawn minion untuk tim biru
            for (let i = 0; i < 3; i++) {
                gameState.minions.push({
                    x: mapData.baseBlue.x,
                    y: mapData.baseBlue.y + (i - 1) * 50,
                    radius: 15,
                    speed: 1,
                    hp: 100,
                    maxHp: 100,
                    damage: 1,
                    team: 'blue',
                    target: { x: mapData.baseRed.x, y: mapData.baseRed.y },
                    lastAttackTime: 0
                });
            }
            
            // Spawn minion untuk tim merah
            for (let i = 0; i < 3; i++) {
                gameState.minions.push({
                    x: mapData.baseRed.x,
                    y: mapData.baseRed.y + (i - 1) * 50,
                    radius: 15,
                    speed: 1,
                    hp: 100,
                    maxHp: 100,
                    damage: 1,
                    team: 'red',
                    target: { x: mapData.baseBlue.x, y: mapData.baseBlue.y },
                    lastAttackTime: 0
                });
            }
        }
        
        function updateMinions() {
            for (let i = gameState.minions.length - 1; i >= 0; i--) {
                const minion = gameState.minions[i];
                
                // Move towards target
                moveTowards(minion, minion.target.x, minion.target.y);
                
                // Attack setiap 3 detik
                const now = Date.now();
                if (now - minion.lastAttackTime >= 3000) {
                    // Cari musuh terdekat
                    let enemy = null;
                    let minDistance = 50; // Range attack
                    
                    if (minion.team === 'blue') {
                        // Cari player merah atau AI merah
                        if (player.team === 'red' && getDistance(minion, player) < minDistance) {
                            enemy = player;
                        } else {
                            gameState.players.forEach(p => {
                                if (p.team === 'red' && p.alive && getDistance(minion, p) < minDistance) {
                                    enemy = p;
                                }
                            });
                        }
                    } else {
                        // Cari player biru atau AI biru
                        if (player.team === 'blue' && getDistance(minion, player) < minDistance) {
                            enemy = player;
                        } else {
                            gameState.players.forEach(p => {
                                if (p.team === 'blue' && p.alive && getDistance(minion, p) < minDistance) {
                                    enemy = p;
                                }
                            });
                        }
                    }
                    
                    // Jika ada musuh, serang
                    if (enemy) {
                        enemy.hp -= minion.damage;
                        minion.lastAttackTime = now;
                    }
                }
                
                // Hapus minion jika sampai di base lawan atau mati
                if (minion.hp <= 0 || getDistance(minion, minion.target) < 50) {
                    gameState.minions.splice(i, 1);
                }
            }
        }
        
        function checkBaseEffects() {
            // Check jika player di base sendiri
            if (getDistance(player, mapData.baseBlue) < mapData.baseBlue.radius) {
                // Regenerasi HP
                player.hp = Math.min(player.maxHp, player.hp + 100);
                updateHpBar();
            }
            
            // Check jika player di base musuh
            if (getDistance(player, mapData.baseRed) < mapData.baseRed.radius) {
                // Kurangi HP
                player.hp -= 100;
                updateHpBar();
                
                // Check jika player mati
                if (player.hp <= 0) {
                    player.deaths++;
                    respawnPlayer();
                }
            }
            
            // Check untuk AI players
            gameState.players.forEach(ai => {
                if (ai.alive && getDistance(ai, mapData.baseBlue) < mapData.baseBlue.radius && ai.team === 'blue') {
                    ai.hp = Math.min(ai.maxHp, ai.hp + 100);
                }
                
                if (ai.alive && getDistance(ai, mapData.baseRed) < mapData.baseRed.radius && ai.team === 'red') {
                    ai.hp = Math.min(ai.maxHp, ai.hp + 100);
                }
            });
        }
        
        function respawnPlayer() {
            player.hp = player.maxHp;
            player.x = mapData.baseBlue.x;
            player.y = mapData.baseBlue.y;
            updateHpBar();
        }
        
        function checkGameOver() {
            // Check jika base musuh hancur
            const redTurret = gameState.turrets.find(turret => turret.team === 'red');
            if (!redTurret || redTurret.hp <= 0) {
                endGame(true); // Victory
            }
            
            // Check jika base sendiri hancur
            const blueTurret = gameState.turrets.find(turret => turret.team === 'blue');
            if (!blueTurret || blueTurret.hp <= 0) {
                endGame(false); // Defeat
            }
        }
        
        function endGame(victory) {
            document.getElementById('game-result').textContent = victory ? 'VICTORY!' : 'DEFEAT';
            document.getElementById('game-result').style.color = victory ? 'gold' : 'red';
            
            document.getElementById('stat-kills').textContent = player.kills;
            document.getElementById('stat-deaths').textContent = player.deaths;
            document.getElementById('stat-assists').textContent = player.assists;
            document.getElementById('stat-gold').textContent = player.gold;
            
            document.getElementById('game-over-modal').style.display = 'flex';
            
            // Update statistik ke Firebase
            if (userData) {
                if (victory) {
                    userData.wins = (userData.wins || 0) + 1;
                } else {
                    userData.losses = (userData.losses || 0) + 1;
                }
                
                // Update rank points
                userData.rankPoints = (userData.rankPoints || 0) + (victory ? 25 : -10);
                
                // Update ke database
                database.ref('users/' + currentUser).set(userData);
            }
        }
        
        function backToMenu() {
            window.location.href = 'index.html';
        }
        
        function updateHpBar() {
            const hpPercent = (player.hp / player.maxHp) * 100;
            document.getElementById('player-hp-bar').style.width = `${hpPercent}%`;
        }
        
        function updateSkillCooldown(skillNum, cooldown) {
            const cooldownElement = document.getElementById(`cooldown-${skillNum}`);
            const skillElement = document.getElementById(`skill-${skillNum}`);
            
            if (cooldown > 0) {
                cooldownElement.style.display = 'flex';
                cooldownElement.textContent = cooldown.toFixed(1);
                skillElement.style.opacity = '0.5';
            } else {
                cooldownElement.style.display = 'none';
                skillElement.style.opacity = '1';
            }
        }
        
        function getDistance(obj1, obj2) {
            const dx = obj1.x - obj2.x;
            const dy = obj1.y - obj2.y;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        // Render function
        function render() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Apply camera transformation
            ctx.save();
            ctx.translate(-camera.x, -camera.y);
            
            // Draw map background
            drawMap();
            
            // Draw bases
            drawBase(mapData.baseBlue, 'blue');
            drawBase(mapData.baseRed, 'red');
            
            // Draw turrets
            gameState.turrets.forEach(turret => {
                drawTurret(turret);
            });
            
            // Draw buffs
            gameState.buffs.forEach(buff => {
                drawBuff(buff);
            });
            
            // Draw minions
            gameState.minions.forEach(minion => {
                drawMinion(minion);
            });
            
            // Draw players (hanya yang alive)
            drawPlayer(player);
            gameState.players.forEach(ai => {
                if (ai.alive) {
                    drawPlayer(ai);
                }
            });
            
            // Draw projectiles
            gameState.projectiles.forEach(projectile => {
                drawProjectile(projectile);
            });
            
            ctx.restore();
            
            // Draw minimap
            drawMinimap();
        }
        
        function drawMap() {
            // Draw grass background
            ctx.fillStyle = '#1a5c1a';
            ctx.fillRect(0, 0, mapData.width, mapData.height);
            
            // Draw lanes
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 10;
            
            // Top lane
            ctx.beginPath();
            ctx.moveTo(mapData.baseBlue.x, mapData.baseBlue.y - 200);
            ctx.lineTo(mapData.baseRed.x, mapData.baseRed.y - 200);
            ctx.stroke();
            
            // Mid lane
            ctx.beginPath();
            ctx.moveTo(mapData.baseBlue.x, mapData.baseBlue.y);
            ctx.lineTo(mapData.baseRed.x, mapData.baseRed.y);
            ctx.stroke();
            
            // Bottom lane
            ctx.beginPath();
            ctx.moveTo(mapData.baseBlue.x, mapData.baseBlue.y + 200);
            ctx.lineTo(mapData.baseRed.x, mapData.baseRed.y + 200);
            ctx.stroke();
            
            // Draw jungle areas
            ctx.fillStyle = '#0f3d0f';
            ctx.fillRect(400, 400, 400, 400);
            ctx.fillRect(400, 1200, 400, 400);
            ctx.fillRect(1200, 400, 400, 400);
            ctx.fillRect(1200, 1200, 400, 400);
        }
        
        function drawBase(base, team) {
            ctx.fillStyle = team === 'blue' ? 'rgba(0, 0, 255, 0.3)' : 'rgba(255, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(base.x, base.y, base.radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = team === 'blue' ? 'blue' : 'red';
            ctx.lineWidth = 5;
            ctx.stroke();
        }
        
        function drawTurret(turret) {
            ctx.fillStyle = turret.team === 'blue' ? 'blue' : 'red';
            ctx.beginPath();
            ctx.arc(turret.x, turret.y, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw turret range jika player dekat
            if (getDistance(player, turret) < 200) {
                ctx.strokeStyle = 'rgba(255, 255, 0, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(turret.x, turret.y, turret.range, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // Draw HP bar
            const hpPercent = turret.hp / 2000;
            ctx.fillStyle = 'red';
            ctx.fillRect(turret.x - 30, turret.y - 40, 60, 5);
            ctx.fillStyle = 'green';
            ctx.fillRect(turret.x - 30, turret.y - 40, 60 * hpPercent, 5);
        }
        
        function drawBuff(buff) {
            if (buff.hp <= 0) return;
            
            ctx.fillStyle = buff.team === 'blue' ? 'lightblue' : 'pink';
            ctx.beginPath();
            ctx.arc(buff.x, buff.y, 25, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('BUFF', buff.x, buff.y + 5);
            
            // Draw HP bar
            const hpPercent = buff.hp / 4000;
            ctx.fillStyle = 'red';
            ctx.fillRect(buff.x - 25, buff.y - 35, 50, 5);
            ctx.fillStyle = 'green';
            ctx.fillRect(buff.x - 25, buff.y - 35, 50 * hpPercent, 5);
        }
        
        function drawMinion(minion) {
            ctx.fillStyle = minion.team === 'blue' ? 'lightblue' : 'pink';
            ctx.beginPath();
            ctx.arc(minion.x, minion.y, minion.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw HP bar
            const hpPercent = minion.hp / minion.maxHp;
            ctx.fillStyle = 'red';
            ctx.fillRect(minion.x - minion.radius, minion.y - minion.radius - 10, minion.radius * 2, 3);
            ctx.fillStyle = 'green';
            ctx.fillRect(minion.x - minion.radius, minion.y - minion.radius - 10, minion.radius * 2 * hpPercent, 3);
        }
        
        function drawPlayer(p) {
            // Draw player circle
            ctx.fillStyle = p.team === 'blue' ? 'blue' : 'red';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw player image (placeholder)
            ctx.fillStyle = 'white';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            
            if (p === player) {
                // Player utama
                ctx.fillText(selectedHero.toUpperCase(), p.x, p.y + 5);
            } else {
                // AI player
                ctx.fillText(p.hero.toUpperCase(), p.x, p.y + 5);
            }
            
            // Draw HP bar
            const hpPercent = p.hp / p.maxHp;
            ctx.fillStyle = 'red';
            ctx.fillRect(p.x - p.radius, p.y - p.radius - 15, p.radius * 2, 5);
            ctx.fillStyle = 'green';
            ctx.fillRect(p.x - p.radius, p.y - p.radius - 15, p.radius * 2 * hpPercent, 5);
        }
        
        function drawProjectile(projectile) {
            ctx.fillStyle = 'yellow';
            ctx.beginPath();
            ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawMinimap() {
            const minimap = document.getElementById('minimap');
            const minimapCtx = minimap.getContext('2d');
            
            // Clear minimap
            minimapCtx.clearRect(0, 0, minimap.width, minimap.height);
            
            // Draw minimap background
            minimapCtx.fillStyle = '#1a5c1a';
            minimapCtx.fillRect(0, 0, minimap.width, minimap.height);
            
            // Calculate scale
            const scaleX = minimap.width / mapData.width;
            const scaleY = minimap.height / mapData.height;
            
            // Draw bases
            minimapCtx.fillStyle = 'blue';
            minimapCtx.beginPath();
            minimapCtx.arc(mapData.baseBlue.x * scaleX, mapData.baseBlue.y * scaleY, 5, 0, Math.PI * 2);
            minimapCtx.fill();
            
            minimapCtx.fillStyle = 'red';
            minimapCtx.beginPath();
            minimapCtx.arc(mapData.baseRed.x * scaleX, mapData.baseRed.y * scaleY, 5, 0, Math.PI * 2);
            minimapCtx.fill();
            
            // Draw player
            minimapCtx.fillStyle = player.team === 'blue' ? 'lightblue' : 'pink';
            minimapCtx.beginPath();
            minimapCtx.arc(player.x * scaleX, player.y * scaleY, 3, 0, Math.PI * 2);
            minimapCtx.fill();
            
            // Draw other players (hanya yang alive)
            gameState.players.forEach(p => {
                if (p.alive) {
                    minimapCtx.fillStyle = p.team === 'blue' ? 'lightblue' : 'pink';
                    minimapCtx.beginPath();
                    minimapCtx.arc(p.x * scaleX, p.y * scaleY, 2, 0, Math.PI * 2);
                    minimapCtx.fill();
                }
            });
            
            // Draw turrets
            gameState.turrets.forEach(turret => {
                minimapCtx.fillStyle = turret.team === 'blue' ? 'blue' : 'red';
                minimapCtx.beginPath();
                minimapCtx.arc(turret.x * scaleX, turret.y * scaleY, 2, 0, Math.PI * 2);
                minimapCtx.fill();
            });
        }
        
        // Mulai game
        window.addEventListener('load', init);
    </script>
</body>
</html>
